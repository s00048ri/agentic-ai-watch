# Generated by `agentic-watch issue-templates` from config/. Do not edit by hand.
name: Propose an organisation
description: Propose an organisation
title: '[Organisation] '
labels:
- add-organisation
body:
- type: markdown
  attributes:
    value: 'This repository is public: do not include confidential information. A
      pull request is created from this form for review before anything changes.'
- type: input
  id: name
  attributes:
    label: Organisation name (English)
  validations:
    required: true
- type: input
  id: name_local
  attributes:
    label: Name in the local language
  validations:
    required: false
- type: input
  id: home_url
  attributes:
    label: Home page URL
    description: The organisation's own website.
  validations:
    required: true
- type: input
  id: domains
  attributes:
    label: Domains accepted as sources
    description: Comma-separated, e.g. example.com
  validations:
    required: true
- type: textarea
  id: pages
  attributes:
    label: Pages to watch
    description: Optional. One URL per line on the organisation's own site (newsroom,
      AI policy page, reports). RSS feeds and sitemaps are also looked up automatically
      from the home page.
  validations:
    required: false
- type: dropdown
  id: org_type
  attributes:
    label: Organisation type
    options:
    - private-sector
    - public-sector
    - academic-institution
    - industry-association
    - non-profit
  validations:
    required: true
- type: dropdown
  id: ecosystem_role
  attributes:
    label: Role in the AI ecosystem
    options:
    - developer
    - deployer
    - developer-deployer
    - regulator
  validations:
    required: true
- type: dropdown
  id: sector
  attributes:
    label: Sector
    options:
    - telecommunications
    - commerce-retail
    - manufacturing
    - energy-utilities
    - financial-services
    - legal
    - healthcare
    - public-administration
    - scientific-research
    - technology
    - transportation
    - professional-business-services
    - media
    - other
  validations:
    required: true
- type: dropdown
  id: region
  attributes:
    label: Region
    options:
    - asia-pacific
    - europe
    - north-america
    - latin-america
    - africa
    - middle-east
    - global
  validations:
    required: true
- type: dropdown
  id: size
  attributes:
    label: Size
    options:
    - large
    - medium
    - small
    - unknown
  validations:
    required: true
- type: dropdown
  id: inclusion_reason
  attributes:
    label: Reason for inclusion
    options:
    - phase2-interviewee
    - phase2-contacted
    - haip-reporter
    - public-body
    - commitment-signatory
