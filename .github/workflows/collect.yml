name: Collect batch results

on:
  schedule:
    - cron: "15 */2 * * *"   # every two hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentic-watch-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anything to collect?
        id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          batches = json.loads(pathlib.Path("state/batches.json").read_text() or "{}")
          run = pathlib.Path("state/run.json")
          open_run = run.exists() and not json.loads(run.read_text()).get("digest_posted", False)
          pending = any(not b.get("collected") for b in batches.values())
          print(f"work={'true' if pending or open_run else 'false'}")
          PY
      - uses: astral-sh/setup-uv@v6
        if: steps.check.outputs.work == 'true'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.work == 'true'
        run: uv sync --frozen --no-dev
      - name: Collect, stage 2, digest
        if: steps.check.outputs.work == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: uv run agentic-watch collect
      - name: Commit state
        if: always() && steps.check.outputs.work == 'true'
        run: |
          git config user.name "agentic-watch-bot"
          git config user.email "agentic-watch-bot@users.noreply.github.com"
          git add ledger state data reports
          git diff --cached --quiet || git commit -m "chore: collect $(TZ=Asia/Tokyo date +%F)"
          git push
