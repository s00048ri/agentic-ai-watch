name: Monthly note

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month (YYYY-MM)"
        required: true

permissions:
  contents: write

concurrency:
  group: agentic-watch-state
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Monthly note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: uv run agentic-watch synthesize --month "${{ inputs.month }}"
      - name: Commit
        run: |
          git config user.name "agentic-watch-bot"
          git config user.email "agentic-watch-bot@users.noreply.github.com"
          git add state reports
          git diff --cached --quiet || git commit -m "chore: monthly note ${{ inputs.month }}"
          git push
