[project]
name = "agentic-watch"
version = "0.1.0"
description = "Weekly monitoring of organisations' own publications on agentic AI (internal pilot)"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.70",
  "authlib>=1.3",
  "feedparser>=6.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
  "streamlit>=1.42",
  "trafilatura>=1.12",
]

[project.scripts]
agentic-watch = "agentic_watch.cli:main"


[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6", "types-pyyaml", "types-python-dateutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_watch"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is left to `ruff format`

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
