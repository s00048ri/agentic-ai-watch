# Keyword filter (SPEC.md §4.2). Matching is case-insensitive after NFKC normalisation
# (full-width and half-width forms are treated as the same). Terms in Latin script match whole
# words, and hyphens count as spaces, so list inflected forms separately (e.g. "ki agent", "ki agenten").
include:
  en: ["agentic", "ai agent", "ai agents", "multi-agent", "multiagent", "autonomous agent", "agentic workflow", "agent platform"]
  ja: ["AIエージェント", "エージェント型AI", "エージェンティックAI", "自律型AI", "マルチエージェント", "AI agent"]
  de: ["ki agent", "ki agenten", "agentische ki", "agentischen ki", "agentenbasierte ki", "autonome agenten", "multiagentensystem", "multiagentensysteme"]
  pt: ["agente de ia", "agentes de ia", "ia agêntica", "agente autônomo", "agentes autônomos", "multiagente", "multiagentes"]
exclude:
  en: ["travel agent", "insurance agent", "real estate agent", "user agent", "secret agent", "free agent"]
  ja: ["代理店", "エージェント契約", "人材エージェント", "転職エージェント"]
  pt: ["agente de viagens", "agente imobiliário", "agente de seguros"]
